name: QueueLess Validation

on:
  push:
    branches:
      - main
  pull_request:
    branches:
      - main
  workflow_dispatch:

permissions:
  contents: write

jobs:
  validate:
    name: Lint and build
    runs-on: ubuntu-latest
    timeout-minutes: 20
    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Set up Node.js
        uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm

      - name: Regenerate npm lockfile metadata
        run: npm install --package-lock-only --ignore-scripts --no-audit --no-fund

      - name: Commit lockfile repair
        run: |
          if git diff --quiet -- package-lock.json; then
            echo "package-lock.json is already synchronized."
            exit 0
          fi
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add package-lock.json
          git commit -m "chore: synchronize npm lockfile"
          git push origin HEAD:main

      - name: Install dependencies
        run: npm ci --no-audit --no-fund

      - name: Run ESLint
        run: npm run lint

      - name: Build Next.js application
        run: npm run build
        env:
          JWT_SECRET: ci-only-placeholder-secret-not-for-production
          MONGODB_URI: mongodb://127.0.0.1:27017/queueless_ci
          ML_API_URL: http://127.0.0.1:8000
